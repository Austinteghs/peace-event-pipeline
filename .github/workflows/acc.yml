name: Staging Environment

on:
  push:
    branches: [staging]

jobs:
  run-scrapers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - run: pip install -r scrapers/requirements.txt
      - run: |
          cd scrapers
          python wanep_nigeria/scraper.py
